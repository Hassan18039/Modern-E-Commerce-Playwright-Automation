name: CI Pipeline
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Lint, Build & Playwright BDD Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # 1. Install frontend dependencies
      - name: Install frontend dependencies
        run: npm ci

      # 2. Lint & TypeScript check
      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      # 3. Build frontend
      - name: Build frontend
        run: npm run build

      # 4. Start dev server in background
      - name: Start frontend dev server
        run: npm run dev &

      # 5. Wait for server to be ready
      - name: Wait for frontend to be ready
        run: npx wait-on http://localhost:5173 --timeout 60000

      # 6. Install Playwright BDD dependencies
      - name: Install Playwright dependencies
        run: npm ci
        working-directory: ./Playwright

      # 7. Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: ./Playwright

      # 8. Run all 30 BDD scenarios
      - name: Run Cucumber BDD tests
        run: npx cucumber-js --config cucumber.json
        working-directory: ./Playwright
        env:
          CI: true
          BASE_URL: http://localhost:5173

      # 9. Upload HTML report (always, even on failure)
      - name: Upload Cucumber HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cucumber-report
          path: Playwright/reports/
          retention-days: 30
