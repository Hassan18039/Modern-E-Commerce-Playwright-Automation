name: CI Pipeline
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Job 1: Lint & TypeScript check ─────────────────────────────────────────
  lint:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

  # ── Job 2: Build ────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Job 3: Cucumber E2E tests ───────────────────────────────────────────────
  e2e-tests:
    name: Playwright BDD Tests
    needs: build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Start frontend preview server
        run: npm run preview &

      - name: Wait for frontend to be ready
        run: npx wait-on http://localhost:4173 --timeout 60000

      - name: Install Playwright dependencies
        run: npm ci
        working-directory: ./Playwright

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: ./Playwright

      - name: Run Cucumber BDD tests
        run: npx cucumber-js --config cucumber.json
        working-directory: ./Playwright
        env:
          CI: true
          BASE_URL: http://localhost:4173

      - name: Upload Cucumber HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cucumber-report
          path: Playwright/reports/
          retention-days: 30
